name: Uptime probe

# A free, account-less synthetic check: every 10 minutes GitHub calls the production API and game server readiness
# endpoints; a failed run emails the repository's watchers. It is a SAFETY NET, not the monitoring plan: GitHub's
# scheduler is best-effort and can lag by minutes. Use a proper uptime monitor as the primary (docs/MONITORING.md),
# and keep this one as the second opinion that does not depend on any vendor.
#
# Does nothing until the repository variable UPTIME_API_URL (e.g. https://api.dyce.games) is set.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ vars.UPTIME_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API is ready (database reachable, not draining)
        run: curl -fsS --max-time 10 --retry 2 --retry-delay 5 "${{ vars.UPTIME_API_URL }}/health/ready"
      - name: Game server is ready
        if: ${{ vars.UPTIME_GAME_URL != '' }}
        run: curl -fsS --max-time 10 --retry 2 --retry-delay 5 "${{ vars.UPTIME_GAME_URL }}/health/ready"
      - name: Web (invite landing page) is up
        if: ${{ vars.UPTIME_WEB_URL != '' }}
        run: curl -fsS --max-time 10 --retry 2 --retry-delay 5 -o /dev/null "${{ vars.UPTIME_WEB_URL }}"
