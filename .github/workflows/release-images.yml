name: Release images

# Builds the two production images and pushes them to GitHub's container registry (ghcr.io) when a version tag is
# pushed:  git tag v0.1.0 && git push origin v0.1.0
# It needs no account beyond GitHub: it uses the workflow's own token. DEPLOYING an image is a separate, deliberate step
# (docs/RUNBOOK.md "Deploy"): this workflow only produces the artifact and records exactly what is in it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: the short commit sha)'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dyce-api, file: apps/api/Dockerfile }
          - { name: dyce-game-server, file: apps/game-server/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          tag="${{ inputs.tag }}"; [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || [ -n "${{ inputs.tag }}" ] || tag="$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          # Two tags: the human one (v0.1.0) and the immutable commit one. Deploy and roll back by commit sha.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          build-args: RELEASE=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - run: echo "Pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
