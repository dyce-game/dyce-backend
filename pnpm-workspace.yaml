packages:
  - apps/*
  - packages/*

# Kept from the monorepo this was split from: the flat layout is known to work with the test runners and
# embedded Postgres here. (The app needed it for Metro; the backend does not, and may drop it later.)
nodeLinker: hoisted
strictPeerDependencies: false
# Don't silently run `pnpm install` before every script (it can hang on a flaky network).
verifyDepsBeforeRun: false

allowBuilds:
  # The embedded PostgreSQL used by the tests ships one package per platform; each has a postinstall that links its
  # binaries. pnpm 11 fails an install with an undecided build script, and CI (Linux) installs the linux one.
  # Windows works without it here, so it stays off; every platform a developer or CI machine can be gets an answer.
  '@embedded-postgres/windows-x64': false
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@swc/core': true
  msgpackr-extract: false
