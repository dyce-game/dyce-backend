# fly.toml app configuration file generated for dyce-game-server on 2026-11-26T08:14:31Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dyce-game-server'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '40s'

[build]
  dockerfile = 'Dockerfile'

[env]
  JOIN_GRACE_SECONDS = '90'
  LOG_FORMAT = 'json'
  NODE_ENV = 'production'
  PORT = '2567'
  RECONNECT_SECONDS = '60'
  SHUTDOWN_DRAIN_MS = '5000'
  SHUTDOWN_TIMEOUT_MS = '25000'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
