# Fly.io configuration for the STAGING API. The production one is fly.toml next to it; keep the two in step except for the
# names, URLs and the migration setting below. The build context MUST BE THE REPOSITORY ROOT (this is a pnpm workspace).
#
# Deploy (from the repository root, not from apps/api):
#
#   fly deploy --config apps/api/fly.staging.toml --remote-only \
#              --build-arg RELEASE=$(git rev-parse --short=12 HEAD)
#
# `--config` only chooses this file; the context is the directory you run the command in. The Dockerfile is named under [build].
# Full steps, secrets, migrations, domains and rollback: deploy/FLY.md.

app = 'dyce-backend-staging'
primary_region = 'ams' # keep it next to the PostgreSQL database (a network round trip per query otherwise)

# Graceful shutdown (apps/api/src/main.ts): on SIGTERM the API answers 503 on /health/ready for SHUTDOWN_DRAIN_MS, closes
# HTTP, WebSockets and the database pool, and exits. Fly sends SIGINT by default and waits 5 seconds, which cuts it off.
kill_signal = 'SIGTERM'
kill_timeout = 40 # seconds: more than SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s)

[build]
# Relative to THIS file (tested with flyctl 0.5.17), so it is right wherever the config lives. The build CONTEXT is the
# directory `fly deploy` runs in, and that must be the repository root: the Fly dashboard's "Working directory" must be
# the repository root too (deploy/FLY.md section 7).
dockerfile = 'Dockerfile'

[env]
# Non-secret settings only. Everything secret is set with `fly secrets set` (deploy/FLY.md section 3).
NODE_ENV = 'production'
PORT = '3000'
LOG_FORMAT = 'json'
SHUTDOWN_DRAIN_MS = '5000'
SHUTDOWN_TIMEOUT_MS = '25000'
# One proxy (Fly's edge) sits in front of the API: its client address is the real one. Wrong value = rate limits
# apply to the proxy instead of the person.
TRUST_PROXY_HOPS = '1'
SMS_DRIVER = 'real'
EMAIL_DRIVER = 'resend'
PUSH_DRIVER = 'expo'
INTEGRITY_DRIVER = 'store' # Pool entry fails closed until the device checks are written (RELEASE_CHECKLIST L6)
INVITE_BASE_URL = 'https://staging.dyce.games'
# The game server is a second Fly app on the private network; the public address is what the phones connect to.
GAME_SERVER_URL = 'http://dyce-game-server-staging.internal:2567'
GAME_SERVER_PUBLIC_URL = 'wss://game-staging.dyce.games'
CORS_ORIGINS = 'https://staging.dyce.games'

[http_service]
internal_port = 3000
force_https = true
# The API runs timers (the nightly ledger check, session clean-up, push jobs) and holds the live chat hub in memory,
# so it must never be stopped for being idle, and there must be exactly ONE machine until the hub moves to Redis
# (Dyce docs/RUNBOOK.md section 12).
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

  [http_service.concurrency]
  type = 'requests'
  soft_limit = 200
  hard_limit = 400

  # Routing check: Fly stops sending traffic to a machine that is not ready (or is draining) but does not restart it.
  # Readiness includes the database; liveness (used by the Docker HEALTHCHECK) never does.
  [[http_service.checks]]
    method = 'GET'
    path = '/health/ready'
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'

# Staging applies migrations on every deploy, before the new machine takes traffic (a failed migration stops the deploy).
# The command is the same everywhere (db/migrate.ts); MIGRATION_DATABASE_URL, a secret of this app, is the owner role.
# PRODUCTION does not do this: it takes a backup point first (RUNBOOK section 3) and the deploy workflow refuses a
# production release that carries a migration until a person says they ran it (deploy/FLY.md section 5).
[deploy]
  release_command = 'node db/migrate.ts'
  strategy = 'rolling'

[[vm]]
size = 'shared-cpu-1x'
memory = '1gb' # the generated file also set memory_mb = 256, which contradicts this and is not a documented key
